<header class="site-header">
    <a class="brand" href="{{ "/" | relURL }}">
        {{ partial "mark.html" (dict) }}
        <span class="visually-hidden">{{ site.Title }}, home</span>
    </a>
    <nav class="site-nav" aria-label="Main">
        {{ $page := . }}
        {{ range site.Menus.main }}
        {{ $exact := eq $page.RelPermalink (.URL | relURL) }}
        {{ $within := and (eq .URL "/") (eq $page.Type "posts") }}
        <a href="{{ .URL | relURL }}"{{ if or $exact $within }} class="is-active"{{ end }}{{ if $exact }} aria-current="page"{{ end }}><span>{{ .Name }}</span></a>
        {{ end }}
    </nav>
</header>
